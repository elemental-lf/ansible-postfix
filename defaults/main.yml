# defaults file for postfix
---
# Database type for lookup tables which are only read at run-time and always
# rebuilt as a whole (aliases, virtual, canonical maps, sasl_passwd, ...)
postfix_database_type_tables: cdb
# Database type for databases which are updated at run-time by postfix itself
# (TLS session caches, ...)
postfix_database_type_caches: lmdb
postfix_install_debian: >-
  {{
    ['postfix', 'mailutils', 'libsasl2-2', 'sasl2-bin', 'libsasl2-modules']
    + (['postfix-lmdb'] if 'lmdb' in [postfix_database_type_tables, postfix_database_type_caches] else [])
    + (['postfix-cdb'] if 'cdb' in [postfix_database_type_tables, postfix_database_type_caches] else [])
  }}
postfix_install_redhat: >-
  {{
    ['postfix', 'cyrus-sasl-plain']
    + (['postfix-lmdb'] if 'lmdb' in [postfix_database_type_tables, postfix_database_type_caches] else [])
    + (['postfix-cdb'] if 'cdb' in [postfix_database_type_tables, postfix_database_type_caches] else [])
  }}
postfix_install_enabled: true
postfix_hostname: "{{ ansible_fqdn }}"
postfix_mailname: "{{ ansible_fqdn }}"
postfix_aliases: []
postfix_virtual_aliases: []
postfix_sender_canonical_maps: []
postfix_relayhost: false
postfix_relayhost_port: 587
postfix_relaytls: false
postfix_sasl_auth_enable: true
postfix_sasl_user: "postmaster@{{ ansible_domain }}"
postfix_sasl_password: 'k8+haga4@#pR'
postfix_sasl_security_options: noanonymous
postfix_inet_interfaces: all
postfix_inet_protocols: all
postfix_mydestination:
  - "{{ postfix_hostname }}"
  - localdomain
  - localhost
  - localhost.localdomain
postfix_mynetworks:
  - 127.0.0.0/8
  - '[::ffff:127.0.0.0]/104'
  - '[::1]/128'
postfix_smtpd_banner: '$myhostname ESMTP $mail_name'
postfix_disable_vrfy_command: false
postfix_message_size_limit: 10240000
